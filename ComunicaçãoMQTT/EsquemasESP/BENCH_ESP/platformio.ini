; PlatformIO Project Configuration File — BENCH_ESP
;
; Projeto de benchmark puro (sem MQTT): mede geração de chaves, assinatura e
; verificação diretamente na ESP32, enviando resultados via Serial.
;
; Selecione o environment desejado ao compilar/fazer upload:
;   pio run -e esp32dev_bench_lots   (benchmark LOTS)
;   pio run -e esp32dev_bench_wots   (benchmark WOTS+)
;   pio run -e esp32dev_bench_hors   (benchmark HORS)
;   pio run -e esp32dev_bench_horst  (benchmark HORST)
;   pio run -e esp32dev_bench_mss   (benchmark MSS)
;   pio run -e esp32dev_bench_sphincs (benchmark SPHINCS)
;
; https://docs.platformio.org/page/projectconf.html

; ─── Configurações comuns ─────────────────────────────────────────────────────
[common]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
build_flags   =
    -D ESP32
    -D BENCH_RUNS=5

; ─── Benchmark LOTS ──────────────────────────────────────────────────────────
[env:esp32dev_bench_lots]
platform      = ${common.platform}
board         = ${common.board}
framework     = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_flags   =
    ${common.build_flags}
    -D BENCH_LOTS
    -I../../../LOTS
    -I../../../SHA256
build_src_filter =
    +<*>
    +<../../../../LOTS/keys.c>
    +<../../../../SHA256/sha256.c>

; ─── Benchmark WOTS+ ─────────────────────────────────────────────────────────
[env:esp32dev_bench_wots]
platform      = ${common.platform}
board         = ${common.board}
framework     = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_flags   =
    ${common.build_flags}
    -D BENCH_WOTS
    -I../../../WOTS
    -I../../../SHA256
build_src_filter =
    +<*>
    +<../../../../WOTS/keys.c>
    +<../../../../WOTS/prf.c>
    +<../../../../SHA256/sha256.c>

; ─── Benchmark HORS ──────────────────────────────────────────────────────────
[env:esp32dev_bench_hors]
platform      = ${common.platform}
board         = ${common.board}
framework     = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_flags   =
    ${common.build_flags}
    -D BENCH_HORS
    -I../../../HORS
    -I../../../SHA256
build_src_filter =
    +<*>
    +<../../../../HORS/keys.c>
    +<../../../../SHA256/sha256.c>

; ─── Benchmark HORST ─────────────────────────────────────────────────────────
[env:esp32dev_bench_horst]
platform      = ${common.platform}
board         = ${common.board}
framework     = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_flags   =
    ${common.build_flags}
    -D BENCH_HORST
    -I../../../HORST
    -I../../../SHA256
build_src_filter =
    +<*>
    +<../../../../HORST/keys.c>
    +<../../../../HORST/horst_tree.c>
    +<../../../../SHA256/sha256.c>

; ─── Benchmark MSS ───────────────────────────────────────────────────────────
[env:esp32dev_bench_mss]
platform      = ${common.platform}
board         = ${common.board}
framework     = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_flags   =
    ${common.build_flags}
    -D BENCH_MSS
    -I../../../MSS
    -I../../../WOTS
    -I../../../SHA256
build_src_filter =
    +<*>
    +<../../../../WOTS/keys.c>
    +<../../../../WOTS/prf.c>
    +<../../../../SHA256/sha256.c>

; ─── Benchmark SPHINCS ───────────────────────────────────────────────────────
[env:esp32dev_bench_sphincs]
platform      = ${common.platform}
board         = ${common.board}
framework     = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_flags   =
    ${common.build_flags}
    -D BENCH_SPHINCS
    -DHORST_T=1024
    -I../../../SPHINCS
    -I../../../HORST
    -I../../../WOTS
    -I../../../SHA256
build_src_filter =
    +<*>
    +<../../../../SPHINCS/sphincs.c>
    +<../../../../SPHINCS/sphincs_address.c>
    +<../../../../SPHINCS/ltree.c>
    +<../../../../SPHINCS/xmss.c>
    +<../../../../HORST/horst_tree.c>
    +<../../../../WOTS/keys.c>
    +<../../../../WOTS/prf.c>
    +<../../../../SHA256/sha256.c>
